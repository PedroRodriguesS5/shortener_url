services:
  backend:
    build: ./back-end
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - TRUSTED_PROXIES=frontend
      - APP_HOST=0.0.0.0
      - APP_PORT=8080
      - BASE_URL=https://quick-linker.netlify.app
      - REDIS_ADDR=redis:6379

  frontend:
    build: ./front-end
    ports:
      - "80:80"
    depends_on:
      - backend

  redis:
    image: "redis:alpine"
